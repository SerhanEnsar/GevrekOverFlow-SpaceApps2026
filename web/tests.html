<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Unit tests</title>
  <style>
    body { font: 14px system-ui, sans-serif; background: #0f1418; color: #e8edf0; padding: 20px; }
    .pass { color: #3fb37f; } .fail { color: #e0573b; } #summary { font-weight: 700; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div id="summary">running…</div>
  <ul id="results"></ul>
  <script type="module">
    import { decodeDb, pixelOf, seriesAt } from "./js/data.js";
    import { labelFor, defaultDateIndex } from "./js/timeline.js";
    import { showSeries, NO_DATA_TEXT } from "./js/chart.js";
    import { classify, interpret, gibsToDb, validateRules } from "./js/rules.js";
    import { validateStory } from "./js/story.js";
    import { SHOWCASES } from "./js/config.js";

    const results = [];
    const test = (name, fn) => {
      try { fn(); results.push([name, true]); }
      catch (e) { results.push([name, false, e.message]); }
    };
    const eq = (a, b) => { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error(`${JSON.stringify(a)} !== ${JSON.stringify(b)}`); };
    const near = (a, b, tol = 1e-9) => { if (Math.abs(a - b) > tol) throw new Error(`${a} !≈ ${b}`); };

    // Fake 2x2 bundle, 2 dates. db = -30 + 0.15 * v
    const scale = { offset: -30, step: 0.15 };
    const manifest = { bbox: [29.0, 36.0, 29.2, 36.2], dates: ["2026-07-22", "2026-08-15"], grid: { width: 2, height: 2 }, db_scale: scale };
    // layout [t][pol][row][col]
    const ts = new Uint8Array([
      100, 0, 100, 100,   80, 0, 80, 80,      // t0 HH, t0 HV  (pixel row0,col1 has no data)
      100, 0, 100, 100,   60, 0, 60, 60,      // t1 HH, t1 HV
    ]);
    const bundle = { manifest, ts };

    test("decodeDb(0) is null (no data)", () => eq(decodeDb(0, scale), null));
    test("decodeDb(200) is 0 dB", () => near(decodeDb(200, scale), 0));
    test("pixelOf outside bbox is null", () => eq(pixelOf(manifest, 28.9, 36.1), null));
    test("pixelOf top-left corner is col 0 row 0", () => eq(pixelOf(manifest, 29.01, 36.19), { col: 0, row: 0 }));
    test("pixelOf bottom-right edge stays inside grid", () => eq(pixelOf(manifest, 29.2, 36.0), { col: 1, row: 1 }));
    test("seriesAt outside bbox is null", () => eq(seriesAt(bundle, 30, 36.1), null));
    test("seriesAt on a no-data pixel is null", () => eq(seriesAt(bundle, 29.15, 36.15), null));
    test("seriesAt single pixel returns HV per date", () => {
      const s = seriesAt(bundle, 29.05, 36.15);
      eq(s.dates, manifest.dates); near(s.hv[0], -18); near(s.hv[1], -21);
    });
    test("seriesAt radius averages only pixels with data", () => {
      const s = seriesAt(bundle, 29.1, 36.1, 20000);
      near(s.hh[0], -15);   // all valid pixels have v=100
    });

    // timeline.js
    test("labelFor before the event", () => eq(labelFor("2026-07-22", "2026-07-28"), "2026-07-22 · before fire"));
    test("labelFor on/after the event", () => eq(labelFor("2026-08-15", "2026-07-28"), "2026-08-15 · after fire"));
    test("default date is the last one before the event", () =>
      eq(defaultDateIndex(["2026-06-28", "2026-07-10", "2026-07-22", "2026-08-15"], "2026-07-28"), 2));
    test("default date falls back to 0 when nothing precedes the event", () =>
      eq(defaultDateIndex(["2026-08-15"], "2026-07-28"), 0));

    // chart.js
    test("clicking outside the data shows 'No radar data here'", () => {
      const el = document.createElement("div");
      showSeries(el, seriesAt(bundle, 30, 36.1), manifest);
      eq(el.textContent.trim(), NO_DATA_TEXT);
      eq(NO_DATA_TEXT, "No radar data here");
    });
    test("a valid series renders a chart canvas", () => {
      const el = document.createElement("div");
      document.body.appendChild(el);
      showSeries(el, seriesAt(bundle, 29.05, 36.15), { ...manifest, event_date: "2026-08-01" });
      eq(!!el.querySelector("canvas"), true);
      el.remove();
    });

    // rules.js (rule engine over web/rules.json)
    const rules = await (await fetch("rules.json")).json();
    results.push(["shipped rules.json is valid", validateRules(rules).length === 0, validateRules(rules).join("; ")]);
    test("water: very low HV", () => eq(classify(rules, { hh: -15, hv: -26 }).id, "water"));
    test("built-up: bright HH, large HH-HV", () => eq(classify(rules, { hh: -4, hv: -16 }).id, "built"));
    test("dense vegetation: high HV", () => eq(classify(rules, { hh: -6, hv: -10 }).id, "forest"));
    test("shrubs: middle HV", () => eq(classify(rules, { hh: -10, hv: -16 }).id, "shrub"));
    test("open ground: low HV, not water", () => eq(classify(rules, { hh: -14, hv: -21 }).id, "open"));
    test("built-up is not offered at ~500 m (global source)", () => eq(classify(rules, { hh: -4, hv: -16 }, "global").id, "shrub"));
    test("value far from thresholds -> high confidence", () => eq(classify(rules, { hh: -6, hv: -8 }).confidence, "high"));
    test("value near a threshold -> low confidence with the alternative", () => {
      const c = classify(rules, { hh: -6, hv: -12.8 });
      eq([c.id, c.confidence, c.alternatives], ["forest", "low", ["shrub"]]);
    });
    test("global source widens the uncertainty band", () =>
      eq(classify(rules, { hh: -6, hv: -12.3 }, "global").confidence, "low"));
    test("no data -> null", () => eq(interpret(rules, { hh: null, hv: -10 }), null));
    test("burn-like drop is explained", () => {
      const e = interpret(rules, { hh: -7, hv: -15.5, dhv: -4.2, prevDate: "2026-07-14" });
      eq(/fell by 4\.2 dB/.test(e.plain), true);
      eq(e.change.id, "loss"); eq(e.change.experimental, false);
      eq(e.expert, "HH −7.0 dB · HV −15.5 dB · HH−HV 8.5 dB · ΔHV −4.2 dB vs 2026-07-14");
    });
    test("small change is not mentioned", () =>
      eq(interpret(rules, { hh: -6, hv: -11, dhv: 0.8, prevDate: "2026-07-14" }).change, null));
    test("a 2.5 dB drop counts only for the global source, as experimental", () => {
      eq(interpret(rules, { hh: -9, hv: -16, dhv: -2.5, prevDate: "x" }).change, null);
      const g = interpret(rules, { hh: -9, hv: -16, dhv: -2.5, prevDate: "x" }, "global");
      eq([g.change.id, g.change.experimental], ["loss", true]);
    });
    test("GIBS colour -> dB uses the fitted model", () => {
      const d = gibsToDb(rules, 69, 144);
      near(d.hv, -61.017 + 9.329 * Math.log(145) + 0.071 * Math.log(70), 1e-9);
      near(d.hh, -50.065 + 7.047 * Math.log(145) + 1.436 * Math.log(70), 1e-9);
    });
    test("rules validation catches a missing fallback class", () =>
      eq(validateRules({ ...rules, classes: rules.classes.slice(0, 2) }).length > 0, true));

    // story.js
    test("story validation catches unknown showcase and missing text", () => {
      const errs = validateStory([{ title: "a", text: "b", showcase: "mars" }, { title: "c", showcase: null }], SHOWCASES);
      eq(errs.length, 2);
    });
    const storyErrs = validateStory(await (await fetch("story.json")).json(), SHOWCASES);
    results.push(["shipped story.json is valid", storyErrs.length === 0, storyErrs.join("; ")]);

    const failed = results.filter((r) => !r[1]).length;
    document.getElementById("summary").textContent = `${results.length - failed}/${results.length} passed`;
    document.getElementById("summary").className = failed ? "fail" : "pass";
    document.getElementById("results").innerHTML = results.map(([n, ok, msg]) =>
      `<li class="${ok ? "pass" : "fail"}">${ok ? "PASS" : "FAIL"} — ${n}${msg ? ` (${msg})` : ""}</li>`).join("");
    window.__TEST_RESULTS__ = { total: results.length, failed };
  </script>
</body>
</html>
